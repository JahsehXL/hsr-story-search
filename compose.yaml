services:
  story-search:
    build: .
    image: hsr-story-search:0.6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      HSR_MODE: server
      HSR_DATA_DIR: /data
    volumes:
      - ./data:/data
    mem_limit: 3g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
